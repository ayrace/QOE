<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minha Carteira QoE — Técnico</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#162033}header{background:#111827;color:white;padding:18px}header h1{margin:0;font-size:21px}header p{margin:5px 0 0;color:#cbd5e1;font-size:13px}main{max-width:980px;margin:auto;padding:16px}.top{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.k{background:white;border-radius:14px;padding:14px;box-shadow:0 2px 12px #0001;cursor:pointer}.k b{display:block;font-size:25px}.k span{font-size:12px;color:#64748b}.tabs{display:flex;gap:7px;overflow:auto;margin:4px 0 14px}.tab{white-space:nowrap;background:white;border:1px solid #dbe3ef;color:#475569}.tab.on{background:#111827;color:white}.card{background:white;border-radius:16px;padding:15px;margin:10px 0;box-shadow:0 2px 12px #0001}.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.port{font-size:18px;font-weight:800}.sub{font-size:12px;color:#64748b;margin-top:4px}.scores{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chip{background:#eef2f7;padding:6px 9px;border-radius:999px;font-size:12px}.rec{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}.mon{background:#fef3c7;color:#92400e}button{border:0;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}.primary{background:#111827;color:white}.secondary{background:#eef2f7;color:#334155}.status{font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px;background:#fee2e2;color:#991b1b}select,input,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:10px;background:white}label{font-size:12px;font-weight:800;display:block;margin:10px 0 5px}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal.open{display:flex}.box{background:white;width:min(650px,100%);max-height:92vh;overflow:auto;padding:18px;border-radius:16px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.empty{text-align:center;padding:40px;color:#64748b}.hist{border-left:3px solid #cbd5e1;padding:0 0 14px 14px;margin:12px 0}.hist h4{margin:0 0 5px}.hist p{margin:5px 0;font-size:13px}.sectiontitle{font-size:14px;font-weight:800;margin:18px 0 8px}@media(max-width:650px){.top{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><h1>Minha Carteira QoE</h1><p id="who">Carteira individual do técnico</p></header>
<main>
<div class="top"><div class="k" onclick="setFilter('PENDENTE')"><b id="kp">0</b><span>Pendentes</span></div><div class="k" onclick="setFilter('ATUACAO_REGISTRADA')"><b id="ka">0</b><span>Atuações registradas</span></div><div class="k" onclick="setFilter('MONITORAMENTO')"><b id="km">0</b><span>Monitoramento/Recorrentes</span></div><div class="k" onclick="setFilter('ESTABILIZADA')"><b id="ke">0</b><span>Estabilizadas</span></div></div>
<div class="tabs"><button class="tab on" data-f="TODAS" onclick="setFilter('TODAS')">Todas</button><button class="tab" data-f="PENDENTE" onclick="setFilter('PENDENTE')">Pendentes</button><button class="tab" data-f="MONITORAMENTO" onclick="setFilter('MONITORAMENTO')">Monitoramento</button><button class="tab" data-f="ESTABILIZADA" onclick="setFilter('ESTABILIZADA')">Estabilizadas</button><button class="tab" data-f="RECORRENTE" onclick="setFilter('RECORRENTE')">Recorrentes</button></div>
<div id="list"></div>
</main>
<div id="modal" class="modal"><div class="box"><h3>Registrar atuação</h3><div id="target" class="sub"></div><label>Tipo de atuação</label><select id="type"><option>Manutenção Coaxial</option><option>MDU</option><option>Indoor</option><option>Sem oportunidade</option><option>Necessita apoio</option><option>Outro</option></select><label>O que foi feito / devolutiva</label><textarea id="ret" rows="4" placeholder="Descreva a análise e a atuação realizada."></textarea><label>Endereço ofensor — MDU/Indoor</label><input id="addr" placeholder="Rua, número, condomínio/local"><label>Observação</label><textarea id="obs" rows="2"></textarea><div class="actions"><button onclick="closeM()">Cancelar</button><button class="primary" onclick="save()">Enviar devolutiva</button></div></div></div>
<div id="histModal" class="modal"><div class="box"><div class="row"><div><h3 id="histTitle" style="margin:0">Histórico da porta</h3><div id="histSub" class="sub"></div></div><button onclick="closeHist()">Fechar</button></div><div id="histBody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL='https://qmbzmccyaaeohcmnudre.supabase.co',SB_KEY='sb_publishable_wIBfxSwQSQdPuULV0TlsKA_UQ1qpYM-',sb=window.supabase.createClient(SB_URL,SB_KEY);const token=new URLSearchParams(location.search).get('t');let DATA=[],HIST=[],current=null,techName='',filter='TODAS';
function fmt(v){return v==null||Number.isNaN(+v)?'-':(+v).toFixed(1).replace('.',',')}function dt(v){if(!v)return'-';return new Date(v).toLocaleString('pt-BR')}
function labelStatus(s){return String(s||'').replaceAll('_',' ')}
async function load(){if(!token){who.textContent='Link individual inválido ou incompleto';list.innerHTML='<div class="empty">Abra o link pessoal enviado pela gestão.</div>';return}const [c,h]=await Promise.all([sb.rpc('portal_tecnico_carteira',{p_token:token}),sb.rpc('portal_tecnico_historico',{p_token:token})]);if(c.error){list.innerHTML='<div class="empty">Não foi possível carregar a carteira.<br>'+c.error.message+'</div>';return}DATA=c.data||[];HIST=h.error?[]:(h.data||[]);techName=DATA[0]?.tecnico||'Técnico';who.textContent=techName+' — carteira individual';render()}
function recurrence(porta){let a=HIST.filter(x=>x.porta===porta);return a.length?Math.max(...a.map(x=>+x.recorrencia||0)):0}
function effectiveStatus(x){let r=recurrence(x.porta);if((x.status==='PENDENTE'||x.status==='MONITORAMENTO')&&r>0&&+x.nota_atual<80)return'RECORRENTE';return x.status}
function setFilter(f){filter=f;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.f===f));render()}
function render(){kp.textContent=DATA.filter(x=>x.status==='PENDENTE').length;ka.textContent=DATA.filter(x=>x.status==='ATUACAO_REGISTRADA').length;km.textContent=DATA.filter(x=>['MONITORAMENTO','RECORRENTE'].includes(effectiveStatus(x))).length;ke.textContent=DATA.filter(x=>effectiveStatus(x)==='ESTABILIZADA').length;let r=DATA.filter(x=>filter==='TODAS'||(filter==='MONITORAMENTO'?['MONITORAMENTO','RECORRENTE'].includes(effectiveStatus(x)):effectiveStatus(x)===filter));list.innerHTML=r.length?r.map(x=>{let st=effectiveStatus(x),rc=recurrence(x.porta),cls=st==='ESTABILIZADA'?'ok':st==='MONITORAMENTO'?'mon':st==='RECORRENTE'?'rec':'';return `<div class="card"><div class="row"><div><div class="port">${x.porta}</div><div class="sub">${x.node||''}</div></div><span class="status ${cls}">${labelStatus(st)}${rc?' · '+rc+'x':''}</span></div><div class="scores"><span class="chip">Média 30d: <b>${fmt(x.media_30d)}</b></span><span class="chip">Atual: <b>${fmt(x.nota_atual)}</b></span>${rc?`<span class="chip rec">Recorrência: <b>${rc}x</b></span>`:''}</div><div style="display:flex;gap:8px;flex-wrap:wrap">${x.status==='PENDENTE'?`<button class="primary" onclick="openM('${x.demanda_id}','${x.porta}')">Registrar atuação</button>`:`<span class="sub">A porta segue no fluxo de acompanhamento.</span>`}<button class="secondary" onclick="openHist('${x.porta}')">Histórico da porta</button></div></div>`}).join(''):'<div class="empty">Nenhuma porta nesta visão.</div>'}
function openHist(porta){let a=HIST.filter(x=>x.porta===porta).sort((a,b)=>new Date(b.atuacao_em)-new Date(a.atuacao_em));let cur=DATA.find(x=>x.porta===porta);histTitle.textContent=porta+' — Histórico';histSub.textContent=(cur?.node||'')+' | Atual: '+fmt(cur?.nota_atual)+' | Média 30d: '+fmt(cur?.media_30d);histBody.innerHTML=a.length?a.map((x,i)=>`<div class="hist"><h4>${dt(x.atuacao_em)} ${+x.recorrencia>0?'<span class="chip rec">Recorrente '+x.recorrencia+'x</span>':''}</h4><p><b>Técnico:</b> ${x.tecnico_atuacao||'-'}</p><p><b>Tipo:</b> ${labelStatus(x.tipo_atuacao)}</p><p><b>O que foi feito:</b> ${x.descricao||'-'}</p>${x.endereco_ofensor?`<p><b>Endereço ofensor:</b> ${x.endereco_ofensor}</p>`:''}${x.observacao?`<p><b>Observação:</b> ${x.observacao}</p>`:''}<p><b>Situação atual da porta:</b> ${fmt(x.nota_atual)}</p></div>`).join(''):'<div class="empty">Ainda não há atuação anterior registrada para esta porta.</div>';histModal.classList.add('open')}
function closeHist(){histModal.classList.remove('open')}
function openM(id,p){current=id;target.innerHTML='<b>'+p+'</b>';type.value='Manutenção Coaxial';ret.value='';addr.value='';obs.value='';modal.classList.add('open')}function closeM(){modal.classList.remove('open');current=null}
async function save(){if(!ret.value.trim())return alert('Informe a devolutiva da atuação.');if((type.value==='MDU'||type.value==='Indoor')&&!addr.value.trim())return alert('Informe o endereço ofensor.');const map={'Manutenção Coaxial':'MANUTENCAO_COAXIAL','MDU':'MDU','Indoor':'INDOOR','Sem oportunidade':'SEM_OPORTUNIDADE','Necessita apoio':'NECESSITA_APOIO','Outro':'OUTRO'};const {error}=await sb.rpc('portal_tecnico_registrar_atuacao',{p_token:token,p_demanda:current,p_tipo:map[type.value],p_descricao:ret.value.trim(),p_endereco:addr.value.trim()||null,p_observacao:obs.value.trim()||null});if(error)return alert('Não foi possível enviar: '+error.message);closeM();await load();alert('Devolutiva enviada para a gestão.')}
load();
</script></body></html>
